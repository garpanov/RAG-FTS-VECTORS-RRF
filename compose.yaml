services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: ${POSTGRES_RESTART_POLICY}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${POSTGRES_DATA_DIR}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:${POSTGRES_DATA_DIR}
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD}

volumes:
  postgres_data:
